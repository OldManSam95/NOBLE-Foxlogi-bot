name: Test Foxlogi Discord Post

on:
  workflow_dispatch:

jobs:
  test-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Foxlogi tasks and post to Discord
        env:
          FOXLOGI_API_KEY: ${{ secrets.FOXLOGI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python foxlogi_bot.py
